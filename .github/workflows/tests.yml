name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test public API and concurrency
        run: python -B -m unittest discover -s tests -v
      - name: Run synthetic example
        run: PYTHONPATH=. python -B examples/synthetic_demo.py
      - name: Run synthetic long-job example
        run: PYTHONPATH=. python -B examples/synthetic_long_job.py
